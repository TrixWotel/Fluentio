<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluentio</title>
  <meta name="robots" content="noindex">
  <script>
    // The Workspace is three spaces of their own now: Data, Code and Notes. A link from before (a bookmark, or a Quick
    // button in your settings) goes on to wherever that thing is now
    (() => {
      const SPACE = { note: 'notes', notes: 'notes', doc: 'data', table: 'data', sheet: 'data', database: 'data', code: 'code' };
      const where = (key) => (Object.hasOwn(SPACE, key) ? SPACE[key] : '');
      let hash = location.hash.slice(1);
      try { hash = decodeURIComponent(hash); } catch {}
      const [a, b] = hash.split('/');
      let space = a === 'new' ? where(b) : where(a), keep = location.hash;
      if (a === 'folder') {
        try { space = where(JSON.parse(localStorage.getItem('fluentio.workspace.folders')).folders.find((x) => x.id === b).tab); } catch {}
      }
      // (and nothing in particular: the tab you were in last)
      if (!space) try { space = where(JSON.parse(localStorage.getItem('fluentio.ws.tab'))); } catch {}
      if (!b) keep = '';                         // (#notes, #database and #code were the tabs: the space itself)
      location.replace(`../${space || 'notes'}/${keep}`);
    })();
  </script>
</head>
<body>
  <p><a href="../data/">Data</a> · <a href="../code/">Code</a> · <a href="../notes/">Notes</a></p>
</body>
</html>
