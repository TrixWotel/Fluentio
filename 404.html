<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Found · Fluentio</title>
  <!-- this page can show up at any address, so its links start from the site's own top folder -->
  <script src="/Fluentio/settings.js"></script>
  <script src="/Fluentio/kit/look.js"></script>
  <script src="/Fluentio/kit/bar.js"></script>
  <link rel="stylesheet" href="/Fluentio/kit/site.css">
  <style>
    body { display: grid; place-items: center; text-align: center; padding: 20px; }
    .lost > * { animation: rise var(--t3) var(--ease) backwards; }
    .lost > :nth-child(2) { animation-delay: calc(90ms / var(--speed)); }
    .lost > :nth-child(3) { animation-delay: calc(180ms / var(--speed)); }
    h1 { margin: 0; font-size: clamp(5rem, 22vw, 9rem); line-height: 1; font-weight: 800; letter-spacing: -0.06em; }
    /* (each digit has its own gradient: Chrome can't clip a gradient to letters that move on their own) */
    h1 span {
      display: inline-block; animation: bob calc(2.4s / var(--speed)) ease-in-out infinite;
      background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 span:nth-child(2) { animation-delay: calc(.2s / var(--speed)); }
    h1 span:nth-child(3) { animation-delay: calc(.4s / var(--speed)); }
    p { color: var(--muted); margin: 8px 0 26px; font-size: 1.1rem; }
    a {
      display: inline-block; padding: 11px 20px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow);
      transition: transform var(--t2) var(--spring), box-shadow var(--t2);
    }
    a:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  </style>
</head>
<body>
  <script>window.fluentio?.bar?.()</script>
  <div class="lost">
    <h1 aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
    <p>That page isn't here.</p>
    <a href="/Fluentio/" id="home">Back to Fluentio</a>
  </div>
  <script>if (window.fluentio) document.getElementById('home').textContent = `Back to ${window.fluentio.settings.name}`;</script>
</body>
</html>
