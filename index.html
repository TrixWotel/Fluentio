<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Tests · Fluentio</title>
  <meta name="description" content="Triangle angle questions and AMC 10 practice, with hundreds of variants and a worked solution for each.">
  <link rel="stylesheet" href="../kit/tests.css">
</head>
<body data-title="Math Tests · Fluentio">
  <main>
    <header id="top">
      <a class="back" href="../">← Fluentio</a>
      <h1>📐 Math Tests</h1>
      <p class="lead">Triangle angles and AMC 10 practice. Every question comes in hundreds of variants, each with a worked solution.</p>
    </header>
    <div id="app"><noscript>These tests need JavaScript.</noscript></div>
  </main>
  <footer>TrixWotel <span id="year">2026</span></footer>
  <script type="module">
    import { testsPage } from '../kit/tests.js';
    import { triangles } from './triangles.js';
    import { amc } from './amc.js';

    const list = (...items) => { const ul = document.createElement('ul'); ul.innerHTML = items.map((i) => `<li>${i}</li>`).join(''); return ul; };
    // AMC problems get harder as you go, so a test puts the easier kinds first
    const EASY_FIRST = ['Percent change', 'Averages', 'Arithmetic sequences', 'Working together', 'Counting divisors', 'Inclusion and exclusion',
      'Remainders of powers', 'Probability with dice', 'Counting committees', 'Right triangles', 'Coordinate geometry', 'Symmetric sums'];

    testsPage({ tests: [
      {
        bank: triangles, name: 'Triangle Angles', length: 10,
        blurb: 'Find the missing angle: isosceles, right, exterior angles, bisectors and more, each drawn to scale.',
        about: 'Every question has its triangle drawn to scale. Type the angle in degrees (or the value of x when asked).',
        asideName: 'Angle facts',
        aside: () => list(
          'The three angles of a triangle add up to <b>180°</b>.',
          'In an isosceles triangle the two sides marked with ticks are equal, and so are the angles opposite them (the base angles).',
          'A right angle (the little square) is 90°, so the other two angles add up to 90°.',
          'An exterior angle equals the sum of the two inside angles away from it, and makes 180° with the angle next to it.',
          'A bisector splits an angle into two equal halves. An altitude meets the opposite side at 90°.'),
      },
      {
        bank: amc, name: 'AMC 10 Practice', amc: true,
        order: (n) => EASY_FIRST.indexOf(amc.make(n).topic),
        blurb: 'Contest-style problems with five choices, and 25-question tests scored like the real AMC 10.',
        about: 'Original problems in the style of the AMC 10 (the real ones belong to the MAA), on 12 classic contest topics. A test is 25 problems, easier ones first, with a 75 minute clock. Answer in any order and change your mind; nothing is marked until you finish.',
      },
    ] });
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
