<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Tests · Fluentio</title>
  <meta name="description" content="Triangle angle questions and AMC 10 practice, with hundreds of variants and a worked solution for each.">
  <script src="../settings.js"></script>
  <script src="../kit/look.js"></script>
  <script src="../kit/bar.js"></script>
  <link rel="stylesheet" href="../kit/site.css">
  <link rel="stylesheet" href="../kit/tests.css">
</head>
<body data-title="Math Tests">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header id="top">
      <a class="back" href="../study/">← <span data-fill="studyTitle">Study</span></a>
      <h1>📐 Math Tests</h1>
      <p class="lead">Triangle angles and AMC 10 practice. Every question comes in hundreds of variants, each with a worked solution.</p>
    </header>
    <div id="app"><noscript>These tests need JavaScript.</noscript></div>
  </main>
  <footer><span data-fill="footer">TrixWotel</span> <span id="year">2026</span></footer>
  <script type="module">
    import { testsPage } from '../kit/tests.js';
    import { triangles } from './triangles.js';
    import { amc } from './amc.js';
    import { triangleLearning } from './triangles-lessons.js';
    import { amcLearning } from './amc-lessons.js';

    const list = (...items) => { const ul = document.createElement('ul'); ul.innerHTML = items.map((i) => `<li>${i}</li>`).join(''); return ul; };

    testsPage({ tests: [
      {
        bank: triangles, name: 'Triangle Angles', length: 10, learn: triangleLearning,
        blurb: 'Find the missing angle: isosceles, right, exterior angles, bisectors and more, each drawn to scale.',
        about: 'Every question has its triangle drawn to scale. Type the angle in degrees (or the value of x when asked).',
        asideName: 'Angle facts',
        aside: () => list(
          'The three angles of a triangle add up to <b>180°</b>.',
          'In an isosceles triangle the two sides marked with ticks are equal, and so are the angles opposite them (the base angles).',
          'A right angle (the little square) is 90°, so the other two angles add up to 90°.',
          'An exterior angle equals the sum of the two inside angles away from it, and makes 180° with the angle next to it.',
          'A bisector splits an angle into two equal halves. An altitude meets the opposite side at 90°.'),
      },
      {
        bank: amc, name: 'AMC 10 Practice', amc: true, learn: amcLearning,
        // how hard a problem is: its rank, where it would sit in a real AMC 10 (the list of topics puts the easier ones first)
        order: (n) => amc.make(n).rank,
        blurb: 'Contest-style problems with five choices, and tests scored like the real AMC 10.',
        asideName: 'Contest strategy',
        aside: () => list(
          '<b>Blank or guess.</b> A right answer is worth 6 points, a blank 1.5 and a wrong one 0. A blind guess among five choices is worth 6/5 = 1.2 on average, less than a blank, but once you rule out two choices a guess is worth 6/3 = 2.',
          '<b>Pace yourself.</b> The real test is 75 minutes for 25 problems, easier ones first. Save time on the early problems, skip one that stalls you, and come back to it at the end.',
          '<b>Try the choices.</b> When an answer is easy to test, put the choices back into the problem. They are in increasing order, so start with (C) and you know which way to go.',
          '<b>Small cases first.</b> When a problem is huge (2,025 terms, 100 people), work out the first few cases by hand and look for the pattern or the cycle.',
          '<b>Pick friendly numbers.</b> If the answer can’t depend on something the problem leaves open, like a price or the side of a square, choose an easy value such as 100 or 1.',
          '<b>What must the answer be?</b> Its last digit, whether it is even, a factor it must have, or its rough size can rule out choices quickly.',
          '<b>Draw it to scale.</b> In geometry, a careful sketch of your own shows which choices are possible and often comes close to the answer.',
          '<b>Read the last line again.</b> Check what is asked (x, or 2x + 1?) and words like at least, at most, different, positive and integer.'),
        about: 'Original problems in the style of the AMC 10 (the real ones belong to the MAA): 117 topics in algebra, number theory, counting, probability and geometry, at every level from problem 1 to problem 25, each asked several different ways, many modelled on past contests up to the 2025 AMC 10A and 10B with new numbers. A test is 25 problems unless you choose another number, with 3 minutes a problem. Answer in any order and change your mind; nothing is marked until you finish.',
      },
    ] });
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
