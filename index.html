<html lang="en">

<body data-title="History">
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header id="top">
      <a class="back" href="../study/">← <span data-fill="studyTitle">Study</span></a>
      <h1>🏰 History</h1>
      <p class="lead">The Middle Ages, from the fall of Rome in 476 to the printing press and 1492: the people, the dates and the big ideas. Learn with lessons, practise, and take tests.</p>

    <div id="app"><noscript>These tests need JavaScript.</noscript></div>
  </main>
  <script type="module">
    import { testsPage } from '../kit/tests.js';
    import { middleAges } from './middle-ages.js';
    import { middleAgesLearning, timeline } from './middle-ages-lessons.js';

    testsPage({ tests: [
      {
        bank: middleAges, name: 'The Middle Ages', length: 20, learn: middleAgesLearning,
        blurb: 'From the fall of Rome to the printing press: Charlemagne, the Vikings, feudalism, the Crusades, Magna Carta, the Black Death, the Hundred Years’ War, and the world beyond Europe.',
        about: 'Each question has choices: who did something and why it mattered, what a word like fief or tithe means, the year or the century of an event, and which of four events came first or last. Learning goes in time order, in five units, each topic with a short lesson.',
        asideName: 'The timeline', aside: timeline,
      },
    ] });
  </script>
