<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluentio</title>
  <meta name="description" content="My personal web playground: modules to study, and my own data, code and notes.">
  <script src="settings.js"></script>
  <script src="kit/look.js"></script>
  <script src="kit/bar.js"></script>
  <link rel="stylesheet" href="kit/site.css">
  <style>
    main { width: 100%; max-width: 1080px; margin: 0 auto; padding: clamp(28px, 7vh, 72px) 20px 40px; flex: 1; }
    .hero > * { animation: rise var(--t3) var(--ease) backwards; }
    .hello { margin: 0 0 6px; color: var(--text); font-size: clamp(1.1rem, 2.4vw, 1.3rem); font-weight: 650; letter-spacing: -0.01em; }
    .name {
      margin: 0; width: fit-content; font-size: clamp(2.3rem, 6vw, 3.3rem); line-height: 1.08; font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(100deg, var(--text) 0 38%, var(--accent) 48%, var(--accent-2) 56%, var(--text) 66% 100%) 0 center / 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: rise var(--t3) var(--ease) backwards, shimmer calc(7s / var(--speed)) linear calc(1.2s / var(--speed)) infinite;
      animation-delay: calc(70ms / var(--speed)), calc(1.2s / var(--speed));
    }
    .lead { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; animation-delay: calc(140ms / var(--speed)); }
    /* the welcome under the name: what the day and your progress say, and a way back to your topic */
    .welcome { margin: 14px 0 0; max-width: 62ch; font-size: 1.02rem; animation-delay: calc(210ms / var(--speed)); }
    .welcome a { margin-left: 6px; color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .welcome a:hover { text-decoration: underline; }
    html.flat .name { background: none; color: var(--text); animation: rise var(--t3) var(--ease) backwards; animation-delay: calc(70ms / var(--speed)); }

    /* the tiles: Recent tall on the left, Modules and Data beside it, Quick across under those */
    .bento { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); grid-auto-flow: row dense; gap: 14px; margin-top: clamp(22px, 4vh, 34px); }
    .bento > * { animation-delay: calc((var(--n, 0) * 70ms + 200ms) / var(--speed)); }
    .tile {
      --c: var(--accent); display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 18px 20px;
      background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line); border-radius: calc(var(--radius) + 6px); box-shadow: var(--shadow);
    }
    .tile:active { transform: translateY(-3px); }
    .tile.big { grid-row: span 2; }
    .tile.wide { grid-column: span 2; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .tile p { margin: 0; }
    .tile-head { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 650; font-size: 1.15rem; letter-spacing: -0.01em; }
    .tile-ic {
      width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: calc(var(--radius) * .8); color: var(--c);
      background: color-mix(in srgb, var(--c) 15%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
    }
    .tile-ic .i { width: 20px; height: 20px; }
    .tile:hover .tile-ic { animation: wiggle calc(.7s / var(--speed)) var(--ease); }
    .tile-go { margin-left: auto; display: grid; color: var(--muted); opacity: 0; transform: translateX(-6px); transition: opacity var(--t2), transform var(--t2) var(--spring), color var(--t1); }
    .tile:hover .tile-go { opacity: 1; transform: none; }
    .tile-head:hover .tile-go { color: var(--c); }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .tile .btn { padding: 6px 12px; font-size: .92rem; }
    .tile .btn .i { width: 16px; height: 16px; }
    /* Recent: what you worked on last, in Data, Code or Notes */
    .recent { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 2px; }
    .recent a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: calc(var(--radius) * .6); color: var(--text); text-decoration: none; transition: background var(--t1), transform var(--t2) var(--ease); }
    .recent a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); transform: translateX(3px); }
    .recent .i { color: var(--c); }
    .recent span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent small { margin-left: auto; padding-left: 10px; color: var(--muted); white-space: nowrap; }
    /* Modules: the topic to go on with, and how far along that test you are */
    .continue { display: grid; gap: 2px; color: var(--text); text-decoration: none; }
    .continue b { font-size: 1.12rem; transition: color var(--t1); }
    .continue:hover b { color: var(--c); }
    .meter { height: 8px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--line) 85%, transparent); }
    .meter div { height: 100%; border-radius: inherit; background: var(--c); animation: fill calc(1s / var(--speed)) var(--ease) backwards; animation-delay: calc(.5s / var(--speed)); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: inherit; text-decoration: none; font-size: .9rem; transition: transform var(--t2) var(--spring), border-color var(--t1); }
    .chip:hover { transform: translateY(-2px); border-color: var(--k, var(--accent)); }
    /* Data: a bar for each sheet, as tall as it has rows */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 44px; }
    .bars span { width: 14px; border-radius: 4px 4px 2px 2px; background: var(--c); transform-origin: bottom; animation: grow-up calc(.7s / var(--speed)) var(--spring) backwards; animation-delay: calc((var(--n, 0) * 60ms + 450ms) / var(--speed)); }
    /* Your progress: three numbers, then each subject */
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--c); }
    .stat span { font-size: .8rem; color: var(--muted); }
    .list { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 1px; }
    .list a, .list li > span { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: calc(var(--radius) * .6); color: var(--text); text-decoration: none; font-size: .94rem; transition: background var(--t1), transform var(--t2) var(--ease); }
    .list a:hover { background: color-mix(in srgb, var(--c) 10%, transparent); transform: translateX(3px); }
    .list small { margin-left: auto; padding-left: 10px; color: var(--muted); white-space: nowrap; }
    /* Today: the date, how far through the year, and what's coming */
    .date b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    /* Question of the day: answer it right here */
    .tile.wide2 { grid-column: span 2; }
    .qd-text { font-size: 1.06rem; }
    .qd-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
    .qd-choice { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: calc(var(--radius) * .7); background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color var(--t1), background var(--t2), transform var(--t2) var(--spring); }
    .qd-choice:hover:not(:disabled) { border-color: var(--c); transform: translateY(-1px); }
    .qd-choice:disabled { cursor: default; }
    .qd-choice b { color: var(--muted); font-weight: 600; }
    .qd-choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg)); animation: bump var(--t3) var(--spring); }
    .qd-choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--bg)); animation: shake calc(.42s / var(--speed)) var(--ease); }
    .qd-type { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .qd-type .input { width: 180px; }
    .qd-result { font-weight: 600; min-height: 1.2em; }
    .qd-result.good { color: var(--good); } .qd-result.bad { color: var(--bad); }
    .qd-more { margin-top: auto; color: var(--c); font-weight: 600; text-decoration: none; }
    .qd-more:hover { text-decoration: underline; }
    .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.15; margin: 0 .1em; }
    .fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
    /* Quick: the settings' buttons */
    .quick-label { display: flex; align-items: center; gap: 12px; margin-right: 6px; font-weight: 650; font-size: 1.05rem; }
    .tile.wide .row { margin-top: 0; }
    .tile.quick .row { flex-direction: column; align-items: flex-start; margin-top: 0; }
    @media (max-width: 820px) { .bento { grid-template-columns: 1fr 1fr; } .tile.big { grid-column: span 2; grid-row: auto; } }
    @media (max-width: 560px) { .bento { grid-template-columns: 1fr; } .tile.big, .tile.wide, .tile.wide2 { grid-column: auto; } }
  </style>
</head>
<body>
  <script>window.fluentio?.bar?.()</script>
  <main>
    <header class="hero">
      <p class="hello" id="hello" hidden></p>
      <h1 class="name" id="name">Fluentio</h1>
      <p class="lead" id="tagline">Web stack workspace</p>
      <p class="welcome" id="welcome" hidden></p>
    </header>
    <section class="bento stagger" id="tiles" aria-label="Your spaces">
      <article class="card tile"><a class="tile-head" href="study/">📚 Modules</a><p class="muted">Tests, lessons and practice in five subjects.</p></article>
    </section>
  </main>
  <script>
    // the home page from the settings (look.js has filled in what settings.js leaves out): the greeting, the name, and
    // the tiles in the settings' order. Recent shows what you worked on last (in Data, Code or Notes), Modules the topic
    // to go on with, Data your sheets, and Quick the settings' buttons.
    if (window.fluentio) {
      const f = window.fluentio, s = f.settings, { el, svg, link } = f, $ = (id) => document.getElementById(id);
      document.title = s.name;
      $('name').textContent = s.name;
      $('tagline').textContent = s.tagline;
      // your visits (one counts after half an hour away, so a reload keeps the welcome's words), topics learned and best
      // scores in every test, by subject, and the newest best (a test like the ones in class, practice or a test)
      const now = Date.now(), day = (t) => new Date(t).toDateString(), v = f.read('fluentio.visits') || {};
      const away = v.at ? Math.round((new Date(day(now)) - new Date(day(v.at))) / 86400000) : null;
      const fresh = !v.at || now - v.at > 30 * 60000;
      const visits = { count: (v.count || 0) + (fresh ? 1 : 0), streak: away === 0 ? v.streak || 1 : away === 1 ? (v.streak || 1) + 1 : 1, away: fresh ? away : v.away ?? null };
      f.write('fluentio.visits', { ...visits, at: now });
      const NAMES = { triangles: 'Triangle Angles', amc10: 'the AMC 10', heat: 'Heat Capacity', kinematics: 'Kinematics', motion: 'Motion in a Straight Line', vectors: 'Vectors', projectiles: 'Projectile Motion', vocab: 'Vocabulary', preterite: 'the preterite', imperfect: 'the imperfect' };
      const IN = { math: ['triangles', 'amc10'], science: ['heat'], physics: ['kinematics', 'motion', 'vectors', 'projectiles'], spanish: ['vocab', 'preterite', 'imperfect'], geography: [] };
      const mine = {};   // id → { learned, bests }
      let learned = 0, bests = 0, best = null;
      for (const [id, name] of Object.entries(NAMES)) {
        const m = mine[id] = { learned: Object.values(f.read(`fluentio.${id}.learn`) || {}).filter((t) => t && t.learned).length, bests: 0 };
        learned += m.learned;
        for (const [key, what] of [['.exam', `the ${name} test`], ['.best', name], ['.best-hard', `${name} (harder)`], ['.best-mixed', `${name} (mixed)`]]) {
          const b = f.read(`fluentio.${id}${key}`);
          if (!b || !b.text) continue;
          m.bests++; bests++;
          if (b.when && (!best || b.when > best.at)) best = { test: what.replace(/^the the /, 'the '), text: b.text, at: b.when };
        }
      }
      const geo = Object.keys(f.read('fluentio.geo.best') || {}).length;
      bests += geo;
      const folderOf = (x) => String(x.link || '').replace(/^\.?\//, '').split('/')[0];
      const welcomed = import(link('kit/welcome.js'));
      if (s.greeting) {
        welcomed.then(({ welcome }) => {
          const w = welcome({ now: new Date(now), visits, last: f.last(), learned, best });
          $('hello').textContent = w.hello;
          $('hello').hidden = false;
          $('welcome').replaceChildren(w.line, w.link ? el('a', { href: w.link.href }, `${w.link.text} →`) : '');
          $('welcome').hidden = false;
        }).catch(() => {});
      }
      const plural = (n, word) => `${n.toLocaleString('en-US')} ${word}${n === 1 ? '' : 's'}`;
      const ago = (t) => { const m = Math.round((Date.now() - (t || 0)) / 60000); return m < 1 ? 'now' : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
      const items = f.workspace.items().sort((a, b) => (b.edited || 0) - (a.edited || 0));
      const ICON = { note: 'note', doc: 'doc', table: 'table', code: 'code' };
      const head = (icon, title, href) => el(href ? 'a' : 'div', { className: 'tile-head', href }, el('span', { className: 'tile-ic' }, svg(icon)), el('span', {}, title), href ? el('span', { className: 'tile-go' }, svg('arrow')) : null);
      const button = (title, href) => el('a', { className: 'btn', href }, svg('plus'), title);
      const tile = (cls, color, ...kids) => { const t = el('article', { className: `card tile ${cls}`.trim() }, ...kids); t.style.setProperty('--c', color); return t; };
      const html = (tag, cls, markup) => { const n = el(tag, { className: cls }); n.innerHTML = markup; return n; };   // (the banks' own markup)
      const midnight = (t) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
      const TILES = {
        workspace: () => tile('big', 'var(--accent-2)',
          head('clock', 'Recent'),
          items.length
            ? el('ul', { className: 'recent' }, items.slice(0, 6).map((it) => el('li', {}, el('a', { href: f.workspace.link(it) },
              svg(ICON[it.kind] || 'note'), el('span', {}, it.title || 'Untitled'), el('small', {}, ago(it.edited))))))
            : el('p', { className: 'muted' }, `What you work on in ${s.dataTitle}, ${s.codeTitle} and ${s.notesTitle} shows here. It’s all kept in this browser.`),
          el('div', { className: 'row' }, button('New note', link('notes/#new/note')), button('New file', link('code/#new/code')))),
        study: () => {
          const last = f.last(), done = last ? Math.max(0, last.learned || 0) : 0, of = last ? Math.max(1, last.total || 1) : 1;
          return tile('', 'var(--accent)', head('study', s.studyTitle, link('study/')), ...(last ? [
            el('a', { className: 'continue', href: last.href }, el('span', { className: 'muted small' }, 'Continue'), el('b', {}, last.topic || last.test || 'Learning')),
            el('div', { className: 'meter', role: 'img', 'aria-label': `${done} of ${of} topics learned` }, el('div', { style: `width:${Math.round((100 * done) / of)}%` })),
            el('p', { className: 'muted small' }, `${last.test ? last.test + ' · ' : ''}${done} of ${plural(of, 'topic')} learned`),
          ] : [
            el('p', { className: 'muted' }, 'Pick a subject to start.'),
            el('div', { className: 'chips' }, s.study.map((x) => {
              const chip = el('a', { className: 'chip', href: link(x.link) }, `${x.emoji || ''} ${x.title || ''}`.trim());
              if (x.color && CSS.supports('color', x.color)) chip.style.setProperty('--k', x.color);
              return chip;
            })),
          ]));
        },
        progress: () => {
          const stat = (n, one, many) => el('div', { className: 'stat' }, el('b', {}, n.toLocaleString('en-US')), el('span', {}, n === 1 ? one : many));
          return tile('', 'var(--good)', head('chart', 'Your progress'),
            el('div', { className: 'stats' }, stat(learned, 'topic learned', 'topics learned'), stat(visits.streak, 'day in a row', 'days in a row'), stat(bests, 'best score', 'best scores')),
            el('ul', { className: 'list' }, s.study.map((x) => {
              const ids = IN[folderOf(x)] || [], l = ids.reduce((n, id) => n + mine[id].learned, 0), b = ids.reduce((n, id) => n + mine[id].bests, 0) + (folderOf(x) === 'geography' ? geo : 0);
              const said = [l && `${l} learned`, b && plural(b, 'best')].filter(Boolean).join(' · ') || 'Not started';
              return el('li', {}, el('a', { href: link(x.link) }, el('span', {}, `${x.emoji || ''} ${x.title || ''}`.trim()), el('small', {}, said)));
            })));
        },
        today: () => {
          const d = new Date(now), start = new Date(d.getFullYear(), 0, 1), days = Math.round((midnight(now) - start) / 86400000) + 1;
          const of = new Date(d.getFullYear(), 1, 29).getMonth() === 1 ? 366 : 365, soon = el('ul', { className: 'list' });
          welcomed.then(({ upcoming }) => soon.replaceChildren(...upcoming(d, 3).map((h) => el('li', {}, el('span', {}, `${h.emoji} ${h.name}`, el('small', {}, h.days === 0 ? 'today' : h.days === 1 ? 'tomorrow' : `in ${h.days} days`)))))).catch(() => {});
          return tile('', 'var(--accent-2)', head('calendar', d.toLocaleDateString('en-US', { weekday: 'long' })),
            el('div', { className: 'date' }, el('b', {}, d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })), el('span', { className: 'muted small' }, `Day ${days} of ${of}`)),
            el('div', { className: 'meter', role: 'img', 'aria-label': `Day ${days} of ${of}` }, el('div', { style: `width:${Math.round((100 * days) / of)}%` })),
            soon);
        },
        // one practice question a day, from a different subject each day (one without a figure), answered right here
        question: () => {
          const box = tile('wide2', 'var(--plot2)', head('spark', 'Question of the day'), el('p', { className: 'muted' }, 'Finding today’s question…'));
          const POOL = [['amc10', 'math/amc.js', 'amc'], ['heat', 'science/heat.js', 'heat'], ['vocab', 'spanish/vocab.js', 'vocab'], ['motion', 'physics/motion.js', 'motionBank'],
            ['amc10', 'math/amc.js', 'amc'], ['preterite', 'spanish/tenses.js', 'preteriteTest'], ['vectors', 'physics/vectors.js', 'vectorBank'], ['imperfect', 'spanish/tenses.js', 'imperfectTest']];
          const today = Math.round((midnight(now) - new Date(2026, 0, 1)) / 86400000), [id, file, name] = POOL[((today % POOL.length) + POOL.length) % POOL.length];
          const folder = file.split('/')[0], subject = s.study.find((x) => folderOf(x) === folder) || { title: folder, emoji: '' };
          Promise.all([import(link(file)), import(link('kit/tests.js'))]).then(([mod, { isRight }]) => {
            const bank = mod[name];
            let n = (Math.imul(today + 1, 2654435761) >>> 0) % bank.count + 1, q = bank.make(n);
            for (let j = 0; j < 80 && q.figure; j++) { n = (n % bank.count) + 1; q = bank.make(n); }
            const a = q.answer, LETTERS = 'ABCDE', key = day(now), saved = f.read('fluentio.today');
            const done = saved && saved.day === key && saved.id === id && saved.n === n ? saved : null;
            const result = el('p', { className: 'qd-result' });
            const shown = () => (a.kind === 'choice' ? `(${LETTERS[a.correct]}) ${a.choices[a.correct]}` : a.kind === 'text' ? a.accept[0] : `${a.value.toLocaleString('en-US', { maximumFractionDigits: 3 })}${a.unit ? ' ' + a.unit : ''}`);
            const say = (right) => { result.className = `qd-result ${right ? 'good' : 'bad'}`; result.innerHTML = right ? '✓ Right! Nice one.' : `✗ Not quite. The answer is <b>${shown()}</b>.`; };
            let area;
            if (a.kind === 'choice') {
              area = el('div', { className: 'qd-choices' }, a.choices.map((c, i) => {
                const b = el('button', { type: 'button', className: 'qd-choice', onclick: () => answer(i) }, el('b', {}, `(${LETTERS[i]})`));
                b.append(html('span', '', c));
                return b;
              }));
            } else {
              const input = el('input', { type: 'text', className: 'input', placeholder: 'Your answer', autocomplete: 'off', spellcheck: false, onkeydown: (e) => { if (e.key === 'Enter') answer(input.value); } });
              area = el('div', { className: 'qd-type' }, input, a.unit ? el('span', { className: 'muted' }, a.unit) : null, el('button', { type: 'button', className: 'btn', onclick: () => answer(input.value) }, 'Check'));
            }
            const settle = (given, right) => {
              if (a.kind === 'choice') [...area.children].forEach((b, i) => { b.disabled = true; if (i === a.correct) b.classList.add('right'); else if (i === given) b.classList.add('wrong'); });
              else { const input = area.querySelector('input'); input.value = given ?? ''; input.readOnly = true; area.querySelector('button').disabled = true; }
              say(right);
            };
            function answer(given) {
              if (a.kind !== 'choice' && !String(given).trim()) return;
              const right = isRight(a, given);
              f.write('fluentio.today', { day: key, id, n, given, right });
              settle(given, right);
            }
            box.replaceChildren(head('spark', 'Question of the day'), el('p', { className: 'muted small' }, `${subject.emoji || ''} ${subject.title} · ${q.topic}`.trim()),
              html('p', 'qd-text', q.text), area, result, el('a', { className: 'qd-more', href: `${link(subject.link || folder + '/')}#${id}/${n}` }, 'See it with the working →'));
            if (done) settle(done.given, done.right);
          }).catch(() => box.replaceChildren(head('spark', 'Question of the day'), el('p', { className: 'muted' }, 'Today’s question didn’t load. Try the subjects in Modules.')));
          return box;
        },
        data: () => {
          const tables = items.filter((it) => it.kind === 'table'), size = (t) => (Array.isArray(t.rows) ? t.rows.length : 0);
          const sizes = tables.slice(0, 8).map(size), most = Math.max(1, ...sizes), rows = tables.reduce((n, t) => n + size(t), 0);
          return tile('', 'var(--good)', head('database', s.dataTitle, link('data/')),
            el('p', { className: 'muted' }, tables.length ? `${plural(tables.length, 'sheet')}, ${plural(rows, 'row')}` : 'No sheets yet. They go in your databases.'),
            tables.length
              ? el('div', { className: 'bars', 'aria-hidden': 'true' }, sizes.map((n, i) => { const bar = el('span', { style: `height:${Math.max(14, Math.round((100 * n) / most))}%` }); bar.style.setProperty('--n', i); return bar; }))
              : el('div', { className: 'row' }, button('New sheet', link('data/#new/table'))));
        },
        quick: () => tile('quick', 'var(--plot2)', head('bolt', 'Quick'),
          el('div', { className: 'row' }, s.quick.filter((q) => q.link && (f.spacesOn || !/^(data|code|notes|workspace)\//.test(link(q.link).slice(f.root.length)))).map((q) => {
            const a = el('a', { className: 'btn', href: link(q.link) }, q.title || q.link);
            if (!link(q.link).startsWith(f.root)) { a.target = '_blank'; a.rel = 'noopener'; }
            return a;
          }))),
      };
      // (while Data, Code and Notes are off, so are Recent, Data and the Quick buttons into them)
      if (!f.spacesOn) { delete TILES.workspace; delete TILES.data; }
      $('tiles').replaceChildren(...s.home.filter((k, i, all) => TILES[k] && all.indexOf(k) === i).map((k) => TILES[k]()));
    }
  </script>
</body>
</html>
